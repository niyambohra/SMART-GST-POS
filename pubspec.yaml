name: smart_gst
description: "SMART GST - A modern Flutter Point of Sale (POS) and Inventory Management Application with Firebase Firestore support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  mobile_scanner: ^7.4.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  crypto: ^3.0.7
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

